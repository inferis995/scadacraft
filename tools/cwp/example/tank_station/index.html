<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tank station</title>
<script src="../resources/apis/proxy.js" cwidget="tank_station" autoResize="disable"></script>
<script src="../resources/apis/MASvrHelper.js"></script>
<style>
/* ISA-101: neutral greys, colour only for abnormal states. No external resources (the plant may be offline). */
:root { --bg:#d6d9dc; --panel:#eceef0; --line:#b5bbc1; --ink:#1b2127; --muted:#67707a; --equip:#4d565f; --liquid:#7d93a6; --alm:#c8102e; --info:#2f6db3; }
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font: 15px "Segoe UI", Arial, sans-serif; display: flex; flex-direction: column; }
header { display: flex; align-items: center; justify-content: space-between; padding: 10px 18px; background: var(--panel); border-bottom: 1px solid var(--line); }
header h1 { margin: 0; font-size: 18px; }
.tag { padding: 3px 9px; border-radius: 3px; font-size: 12px; font-weight: 700; text-transform: uppercase; border: 1px solid var(--line); }
.tag.alm { background: var(--alm); color: #fff; border-color: var(--alm); }
main { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 14px; padding: 14px 18px; min-height: 0; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
.card h2 { margin: 0; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.tankrow { display: flex; gap: 16px; align-items: flex-end; flex: 1; min-height: 120px; }
.tank { position: relative; width: 70px; height: 100%; border: 2px solid var(--equip); border-radius: 3px 3px 8px 8px; background: #f6f7f8; overflow: hidden; }
.fill { position: absolute; left: 0; right: 0; bottom: 0; background: var(--liquid); transition: height .4s; }
.sp { position: absolute; left: -2px; right: -2px; border-top: 2px dashed var(--ink); }
.big { font: 34px Consolas, monospace; }
.big small { font-size: 15px; color: var(--muted); }
.state { font-size: 20px; font-weight: 700; }
.state.fault { color: var(--alm); }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
button, input { font: inherit; }
.btn { border: 1px solid var(--line); background: #fff; border-radius: 4px; padding: 8px 14px; cursor: pointer; font-weight: 600; }
.btn.pri { background: var(--equip); color: #fff; border-color: var(--equip); }
input { width: 90px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 4px; text-align: right; }
.note { color: var(--muted); font-size: 13px; }
#dlg { position: fixed; inset: 0; background: rgba(20,24,28,.45); display: grid; place-items: center; }
#dlg[hidden] { display: none; }
#dlg .box { background: var(--panel); border-radius: 6px; padding: 18px 20px; width: min(380px, 92vw); }
</style>
</head>
<body>
<header><h1 id="title">Tank station</h1><span class="tag" id="link">Not connected</span></header>
<main>
  <section class="card">
    <h2>Tank</h2>
    <div class="tankrow">
      <div class="tank"><div class="fill" id="fill"></div><div class="sp" id="spmark" title="Setpoint"></div></div>
      <div><div class="big"><span id="level">--</span><small> m</small></div>
        <div class="note">Setpoint <span id="spv">--</span> m · <span id="pct">--</span> of the tank</div></div>
    </div>
  </section>
  <section class="card">
    <h2>Pump</h2>
    <div class="state" id="pstate">--</div>
    <div class="note">Outlet flow <b id="flow">--</b> m³/h</div>
    <div class="row"><button class="btn pri" data-cmd="cmd_start">Start</button><button class="btn" data-cmd="cmd_stop">Stop</button></div>
    <h2>Level setpoint</h2>
    <div class="row"><input id="spin" inputmode="decimal" aria-label="New level setpoint"><span>m</span><button class="btn" id="spset">Set</button></div>
  </section>
</main>
<div id="dlg" hidden><div class="box"><p id="dlgt"></p><div class="row" style="justify-content:flex-end"><button class="btn" id="no">Cancel</button><button class="btn pri" id="ok">Confirm</button></div></div></div>
<script src="build/props.js"></script>
<script src="build/tank_station.js"></script>
</body>
</html>

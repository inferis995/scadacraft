<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" id="ob_root" width="192" height="120" viewBox="0 0 192 120" overflow="visible">
  <desc>ScadaCraft OpenBridge widget: Alert frame (obc-alert-frame, OpenBridge 1.0.0, Apache-2.0).
Library: OpenBridge · Alerts and status. Box 192x120 px, anchor at (0,0).
Bindable properties:
  _pb_active (default false, read): Frame visible (alert active); place it around the equipment
  _ps_status (default 'alarm', read): Type: alarm | warning | caution
  _ps_thickness (default 'regular', read): Border: regular | thick</desc>
  <rect id="ob_bg" x="0" y="0" width="192" height="120" fill="none" />
  <image id="ob_preview" x="0" y="0" width="192" height="120" href="data:image/png;base64," xlink:href="data:image/png;base64," />
  <foreignObject id="ob_fo" x="0" y="0" width="192" height="120" overflow="visible">
    <div xmlns="http://www.w3.org/1999/xhtml" style="position:relative;width:100%;height:100%;overflow:visible;">
      <obc-alert-frame id="ob_el" style="position:absolute;left:0;top:0;width:192px;height:120px;display:block;"></obc-alert-frame>
    </div>
  </foreignObject>
  <script type="text/javascript"><![CDATA[
//!export-start
let _pb_active = false;
let _ps_status = 'alarm';
let _ps_thickness = 'regular';
//!export-end

var __busyUntil = 0;

function toBool(v) {
    if (v === true || v === 1) return true;
    var s = String(v).toLowerCase();
    return s === 'true' || s === '1' || s === 'on';
}

function toNum(v) {
    var n = parseFloat(v);
    return isNaN(n) ? 0 : n;
}

function apply() {
    var preview = document.getElementById('ob_preview');
    if (preview && preview.parentNode) { preview.parentNode.removeChild(preview); }
    var el = document.getElementById('ob_el');
    if (!el) return;
    el.status = String(_ps_status);
    el.thickness = String(_ps_thickness);
    el.style.visibility = toBool(_pb_active) ? 'visible' : 'hidden';
}

function putValue(id, value) {
    if (id === '_pb_active') { _pb_active = toBool(value); }
    if (id === '_ps_status') { _ps_status = String(value); }
    if (id === '_ps_thickness') { _ps_thickness = String(value); }
    apply();
}

function postValue(id, value) {
    // replaced at runtime: writes value to the tag bound to "id"
}

function fitBox() {
    var root = document.getElementById('ob_root');
    var fo = document.getElementById('ob_fo');
    var el = document.getElementById('ob_el');
    if (!root || !fo || !el) return;
    var w = parseFloat(root.getAttribute('width')) || 192;
    var h = parseFloat(root.getAttribute('height')) || 120;
    if (root.getAttribute('viewBox') !== '0 0 ' + w + ' ' + h) {
        root.setAttribute('viewBox', '0 0 ' + w + ' ' + h);
    }
    fo.setAttribute('width', w);
    fo.setAttribute('height', h);
    el.style.width = w + 'px';
    el.style.height = h + 'px';
}

(function () {
    var root = document.getElementById('ob_root');
    fitBox();
    if (root && window.MutationObserver) {
        new MutationObserver(fitBox).observe(root, { attributes: true, attributeFilter: ['width', 'height'] });
    }
})();

apply();
]]></script>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" id="ob_root" width="96" height="48" viewBox="0 0 96 48" overflow="visible">
  <desc>ScadaCraft OpenBridge widget: Tag label (obc-tag, OpenBridge 1.0.0, Apache-2.0).
Library: OpenBridge · Alerts and status. Box 96x48 px, anchor at (0,0).
Bindable properties:
  _ps_label (default 'AUTO', read): Text (bind a string tag for live state text)
  _ps_color (default 'blue', read): Colour: gray | blue | cyan | teal | green | yellow | orange | red | magenta | purple</desc>
  <rect id="ob_bg" x="0" y="0" width="96" height="48" fill="none" />
  <image id="ob_preview" x="0" y="0" width="96" height="48" href="data:image/png;base64," xlink:href="data:image/png;base64," />
  <foreignObject id="ob_fo" x="0" y="0" width="96" height="48" overflow="visible">
    <div xmlns="http://www.w3.org/1999/xhtml" style="position:relative;width:100%;height:100%;overflow:visible;display:flex;align-items:center;justify-content:flex-start;">
      <obc-tag id="ob_el" style=""></obc-tag>
    </div>
  </foreignObject>
  <script type="text/javascript"><![CDATA[
//!export-start
let _ps_label = 'AUTO';
let _ps_color = 'blue';
//!export-end

var __busyUntil = 0;

function toBool(v) {
    if (v === true || v === 1) return true;
    var s = String(v).toLowerCase();
    return s === 'true' || s === '1' || s === 'on';
}

function toNum(v) {
    var n = parseFloat(v);
    return isNaN(n) ? 0 : n;
}

function apply() {
    var preview = document.getElementById('ob_preview');
    if (preview && preview.parentNode) { preview.parentNode.removeChild(preview); }
    var el = document.getElementById('ob_el');
    if (!el) return;
    el.label = String(_ps_label);
    el.color = String(_ps_color);
}

function putValue(id, value) {
    if (id === '_ps_label') { _ps_label = String(value); }
    if (id === '_ps_color') { _ps_color = String(value); }
    apply();
}

function postValue(id, value) {
    // replaced at runtime: writes value to the tag bound to "id"
}

function fitBox() {
    var root = document.getElementById('ob_root');
    var fo = document.getElementById('ob_fo');
    var el = document.getElementById('ob_el');
    if (!root || !fo || !el) return;
    var w = parseFloat(root.getAttribute('width')) || 96;
    var h = parseFloat(root.getAttribute('height')) || 48;
    if (root.getAttribute('viewBox') !== '0 0 ' + w + ' ' + h) {
        root.setAttribute('viewBox', '0 0 ' + w + ' ' + h);
    }
    fo.setAttribute('width', w);
    fo.setAttribute('height', h);

}

(function () {
    var root = document.getElementById('ob_root');
    fitBox();
    if (root && window.MutationObserver) {
        new MutationObserver(fitBox).observe(root, { attributes: true, attributeFilter: ['width', 'height'] });
    }
})();

apply();
]]></script>
</svg>

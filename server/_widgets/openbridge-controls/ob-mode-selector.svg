<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" id="ob_root" width="288" height="48" viewBox="0 0 288 48" overflow="visible">
  <desc>ScadaCraft OpenBridge widget: Mode selector (3 options) (obc-toggle-button-group, OpenBridge 1.0.0, Apache-2.0).
Library: OpenBridge · Controls. Box 288x48 px, anchor at (0,0).
Bindable properties:
  _pn_value (default 0, rw): Selected option index 0, 1, 2 (written on selection)
  _ps_option1 (default 'Man', read): Option 0 text
  _ps_option2 (default 'Auto', read): Option 1 text
  _ps_option3 (default 'Off', read): Option 2 text (empty = only two options)
  _pb_disabled (default false, read): Disabled (operator cannot act)</desc>
  <rect id="ob_bg" x="0" y="0" width="288" height="48" fill="none" />
  <image id="ob_preview" x="0" y="0" width="288" height="48" href="data:image/png;base64," xlink:href="data:image/png;base64," />
  <foreignObject id="ob_fo" x="0" y="0" width="288" height="48" overflow="visible">
    <div xmlns="http://www.w3.org/1999/xhtml" style="position:relative;width:100%;height:100%;overflow:visible;display:flex;align-items:center;">
      <obc-toggle-button-group id="ob_el" style="display:block;width:100%;"><obc-toggle-button-option id="ob_o1" value="0">Man</obc-toggle-button-option><obc-toggle-button-option id="ob_o2" value="1">Auto</obc-toggle-button-option><obc-toggle-button-option id="ob_o3" value="2">Off</obc-toggle-button-option></obc-toggle-button-group>
    </div>
  </foreignObject>
  <script type="text/javascript"><![CDATA[
//!export-start
let _pn_value = 0;
let _ps_option1 = 'Man';
let _ps_option2 = 'Auto';
let _ps_option3 = 'Off';
let _pb_disabled = false;
//!export-end

var __busyUntil = 0;

function toBool(v) {
    if (v === true || v === 1) return true;
    var s = String(v).toLowerCase();
    return s === 'true' || s === '1' || s === 'on';
}

function toNum(v) {
    var n = parseFloat(v);
    return isNaN(n) ? 0 : n;
}

function apply() {
    var preview = document.getElementById('ob_preview');
    if (preview && preview.parentNode) { preview.parentNode.removeChild(preview); }
    var el = document.getElementById('ob_el');
    if (!el) return;
    el.disabled = toBool(_pb_disabled);
    el.value = String(Math.round(toNum(_pn_value)));
    [['ob_o1', _ps_option1], ['ob_o2', _ps_option2], ['ob_o3', _ps_option3]].forEach(function (o) {
        var opt = document.getElementById(o[0]); if (!opt) return;
        opt.textContent = String(o[1]); opt.style.display = String(o[1]) ? '' : 'none';
    });
}

function putValue(id, value) {
    if (Date.now() < __busyUntil && ["_pn_value"].indexOf(id) >= 0) return;
    if (id === '_pn_value') { _pn_value = toNum(value); }
    if (id === '_ps_option1') { _ps_option1 = String(value); }
    if (id === '_ps_option2') { _ps_option2 = String(value); }
    if (id === '_ps_option3') { _ps_option3 = String(value); }
    if (id === '_pb_disabled') { _pb_disabled = toBool(value); }
    apply();
}

function postValue(id, value) {
    // replaced at runtime: writes value to the tag bound to "id"
}

(function () {
    var el = document.getElementById('ob_el');
    if (!el) return;
    var timer = null;
    el.addEventListener('value', function (ev) {
        if (!(true)) return;
        _pn_value = toNum(ev.detail && ev.detail.value);
        __busyUntil = Date.now() + 1000;
        if (timer) { clearTimeout(timer); }
        timer = setTimeout(function () { timer = null; postValue('_pn_value', _pn_value); }, 0);
    });
})();

function fitBox() {
    var root = document.getElementById('ob_root');
    var fo = document.getElementById('ob_fo');
    var el = document.getElementById('ob_el');
    if (!root || !fo || !el) return;
    var w = parseFloat(root.getAttribute('width')) || 288;
    var h = parseFloat(root.getAttribute('height')) || 48;
    if (root.getAttribute('viewBox') !== '0 0 ' + w + ' ' + h) {
        root.setAttribute('viewBox', '0 0 ' + w + ' ' + h);
    }
    fo.setAttribute('width', w);
    fo.setAttribute('height', h);

}

(function () {
    var root = document.getElementById('ob_root');
    fitBox();
    if (root && window.MutationObserver) {
        new MutationObserver(fitBox).observe(root, { attributes: true, attributeFilter: ['width', 'height'] });
    }
})();

apply();
]]></script>
</svg>

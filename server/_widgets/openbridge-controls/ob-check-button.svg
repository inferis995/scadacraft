<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" id="ob_root" width="144" height="48" viewBox="0 0 144 48" overflow="visible">
  <desc>ScadaCraft OpenBridge widget: Check button (obc-check-button, OpenBridge 1.0.0, Apache-2.0).
Library: OpenBridge · Controls. Box 144x48 px, anchor at (0,0).
Bindable properties:
  _pb_value (default false, rw): Checked state, written (1/0) on click
  _ps_label (default 'Bypass', read): Button text
  _ps_type (default 'regular', read): Style: regular | checkbox
  _pb_disabled (default false, read): Disabled (operator cannot act)</desc>
  <metadata data-scadacraft="widget-properties">{"widget": "Check button", "properties": {"_pb_value": {"label": "Checked state", "description": "Checked state, written (1/0) on click", "dir": "rw"}, "_ps_label": {"label": "Button text", "description": "Button text", "dir": "read"}, "_ps_type": {"label": "Style", "description": "Style: regular | checkbox", "dir": "read"}, "_pb_disabled": {"label": "Disabled", "description": "Disabled (operator cannot act)", "dir": "read"}}}</metadata>
  <rect id="ob_bg" x="0" y="0" width="144" height="48" fill="none" />
  <image id="ob_preview" x="0" y="0" width="144" height="48" href="data:image/png;base64," xlink:href="data:image/png;base64," />
  <foreignObject id="ob_fo" x="0" y="0" width="144" height="48" overflow="visible">
    <div xmlns="http://www.w3.org/1999/xhtml" style="position:relative;width:100%;height:100%;overflow:visible;display:flex;align-items:center;">
      <obc-check-button id="ob_el" style="display:block;width:100%;"></obc-check-button>
    </div>
  </foreignObject>
  <script type="text/javascript"><![CDATA[
//!export-start
let _pb_value = false;
let _ps_label = 'Bypass';
let _ps_type = 'regular';
let _pb_disabled = false;
//!export-end

var __busyUntil = 0;

function toBool(v) {
    if (v === true || v === 1) return true;
    var s = String(v).toLowerCase();
    return s === 'true' || s === '1' || s === 'on';
}

function toNum(v) {
    if (v === true || v === 'true') return 1;
    if (v === false || v === 'false') return 0;
    var n = parseFloat(v);
    return isNaN(n) ? 0 : n;
}

function apply() {
    var preview = document.getElementById('ob_preview');
    if (preview && preview.parentNode) { preview.parentNode.removeChild(preview); }
    var el = document.getElementById('ob_el');
    if (!el) return;
    el.checked = toBool(_pb_value);
    el.type = String(_ps_type);
    el.disabled = toBool(_pb_disabled);
    el.textContent = String(_ps_label);
    el.fullWidth = true;
}

function putValue(id, value) {
    if (Date.now() < __busyUntil && ["_pb_value"].indexOf(id) >= 0) return;
    if (id === '_pb_value') { _pb_value = toBool(value); }
    if (id === '_ps_label') { _ps_label = String(value); }
    if (id === '_ps_type') { _ps_type = String(value); }
    if (id === '_pb_disabled') { _pb_disabled = toBool(value); }
    apply();
}

function postValue(id, value) {
    // replaced at runtime: writes value to the tag bound to "id"
}

(function () {
    var el = document.getElementById('ob_el');
    if (!el) return;
    var timer = null;
    el.addEventListener('check-button-click', function (ev) {
        if (!(true)) return;
        _pb_value = !!(ev.detail && ev.detail.checked);
        __busyUntil = Date.now() + 1000;
        if (timer) { clearTimeout(timer); }
        timer = setTimeout(function () { timer = null; postValue('_pb_value', (_pb_value ? 1 : 0)); }, 0);
    });
})();

function fitBox() {
    var root = document.getElementById('ob_root');
    var fo = document.getElementById('ob_fo');
    var el = document.getElementById('ob_el');
    if (!root || !fo || !el) return;
    var w = parseFloat(root.getAttribute('width')) || 144;
    var h = parseFloat(root.getAttribute('height')) || 48;
    if (root.getAttribute('viewBox') !== '0 0 ' + w + ' ' + h) {
        root.setAttribute('viewBox', '0 0 ' + w + ' ' + h);
    }
    fo.setAttribute('width', w);
    fo.setAttribute('height', h);

}

(function () {
    var root = document.getElementById('ob_root');
    fitBox();
    if (root && window.MutationObserver) {
        new MutationObserver(fitBox).observe(root, { attributes: true, attributeFilter: ['width', 'height'] });
    }
})();

apply();
]]></script>
</svg>

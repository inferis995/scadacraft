<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" id="ob_root" width="96" height="96" viewBox="0 0 96 96" overflow="visible">
  <desc>ScadaCraft OpenBridge widget: Circular progress (obc-circular-progress, OpenBridge 1.0.0, Apache-2.0).
Library: OpenBridge · Instruments. Box 96x96 px, anchor at (0,0).
Bindable properties:
  _pn_value (default 0, read): Progress 0-100 %</desc>
  <rect id="ob_bg" x="0" y="0" width="96" height="96" fill="none" />
  <image id="ob_preview" x="0" y="0" width="96" height="96" href="data:image/png;base64," xlink:href="data:image/png;base64," />
  <foreignObject id="ob_fo" x="0" y="0" width="96" height="96" overflow="visible">
    <div xmlns="http://www.w3.org/1999/xhtml" style="position:relative;width:100%;height:100%;overflow:visible;">
      <obc-circular-progress id="ob_el" style="position:absolute;left:0;top:0;width:96px;height:96px;display:block;"></obc-circular-progress>
    </div>
  </foreignObject>
  <script type="text/javascript"><![CDATA[
//!export-start
let _pn_value = 0;
//!export-end

var __busyUntil = 0;

function toBool(v) {
    if (v === true || v === 1) return true;
    var s = String(v).toLowerCase();
    return s === 'true' || s === '1' || s === 'on';
}

function toNum(v) {
    var n = parseFloat(v);
    return isNaN(n) ? 0 : n;
}

function apply() {
    var preview = document.getElementById('ob_preview');
    if (preview && preview.parentNode) { preview.parentNode.removeChild(preview); }
    var el = document.getElementById('ob_el');
    if (!el) return;
    el.value = toNum(_pn_value);
}

function putValue(id, value) {
    if (id === '_pn_value') { _pn_value = toNum(value); }
    apply();
}

function postValue(id, value) {
    // replaced at runtime: writes value to the tag bound to "id"
}

(function () {
    var el = document.getElementById('ob_el');
    if (!el) return;
    el.mode = 'determinate';
})();

function fitBox() {
    var root = document.getElementById('ob_root');
    var fo = document.getElementById('ob_fo');
    var el = document.getElementById('ob_el');
    if (!root || !fo || !el) return;
    var w = parseFloat(root.getAttribute('width')) || 96;
    var h = parseFloat(root.getAttribute('height')) || 96;
    if (root.getAttribute('viewBox') !== '0 0 ' + w + ' ' + h) {
        root.setAttribute('viewBox', '0 0 ' + w + ' ' + h);
    }
    fo.setAttribute('width', w);
    fo.setAttribute('height', h);
    el.style.width = w + 'px';
    el.style.height = h + 'px';
}

(function () {
    var root = document.getElementById('ob_root');
    fitBox();
    if (root && window.MutationObserver) {
        new MutationObserver(fitBox).observe(root, { attributes: true, attributeFilter: ['width', 'height'] });
    }
})();

apply();
]]></script>
</svg>

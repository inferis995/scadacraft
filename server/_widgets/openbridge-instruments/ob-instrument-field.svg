<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" id="ob_root" width="144" height="72" viewBox="0 0 144 72" overflow="visible">
  <desc>ScadaCraft OpenBridge widget: Instrument field (obc-instrument-field, OpenBridge 1.0.0, Apache-2.0).
Library: OpenBridge · Instruments. Box 144x72 px, anchor at (0,0).
Bindable properties:
  _pn_value (default 0, read): Process value
  _pb_hasSetpoint (default false, read): Show the setpoint marker
  _pn_setpoint (default 0, read): Setpoint (shown when _pb_hasSetpoint is true)
  _ps_unit (default '', read): Engineering unit
  _ps_tag (default 'PT-101', read): Instrument tag / label
  _pn_digits (default 3, read): Integer digits
  _pn_decimals (default 1, read): Decimal digits
  _ps_size (default 'enhanced', read): Size: regular | enhanced
  _pb_off (default false, read): Instrument off (shows dashes)</desc>
  <metadata data-scadacraft="widget-properties">{"widget": "Instrument field", "properties": {"_pn_value": {"label": "Process value", "description": "Process value", "dir": "read"}, "_pb_hasSetpoint": {"label": "Show the setpoint marker", "description": "Show the setpoint marker", "dir": "read"}, "_pn_setpoint": {"label": "Setpoint", "description": "Setpoint (shown when _pb_hasSetpoint is true)", "dir": "read"}, "_ps_unit": {"label": "Engineering unit", "description": "Engineering unit", "dir": "read"}, "_ps_tag": {"label": "Instrument tag / label", "description": "Instrument tag / label", "dir": "read"}, "_pn_digits": {"label": "Integer digits", "description": "Integer digits", "dir": "read"}, "_pn_decimals": {"label": "Decimal digits", "description": "Decimal digits", "dir": "read"}, "_ps_size": {"label": "Size", "description": "Size: regular | enhanced", "dir": "read"}, "_pb_off": {"label": "Instrument off", "description": "Instrument off (shows dashes)", "dir": "read"}}}</metadata>
  <rect id="ob_bg" x="0" y="0" width="144" height="72" fill="none" />
  <image id="ob_preview" x="0" y="0" width="144" height="72" href="data:image/png;base64," xlink:href="data:image/png;base64," />
  <foreignObject id="ob_fo" x="0" y="0" width="144" height="72" overflow="visible">
    <div xmlns="http://www.w3.org/1999/xhtml" style="position:relative;width:100%;height:100%;overflow:visible;display:flex;align-items:center;justify-content:flex-start;">
      <obc-instrument-field id="ob_el" style=""></obc-instrument-field>
    </div>
  </foreignObject>
  <script type="text/javascript"><![CDATA[
//!export-start
let _pn_value = 0;
let _pb_hasSetpoint = false;
let _pn_setpoint = 0;
let _ps_unit = '';
let _ps_tag = 'PT-101';
let _pn_digits = 3;
let _pn_decimals = 1;
let _ps_size = 'enhanced';
let _pb_off = false;
//!export-end

var __busyUntil = 0;

function toBool(v) {
    if (v === true || v === 1) return true;
    var s = String(v).toLowerCase();
    return s === 'true' || s === '1' || s === 'on';
}

function toNum(v) {
    if (v === true || v === 'true') return 1;
    if (v === false || v === 'false') return 0;
    var n = parseFloat(v);
    return isNaN(n) ? 0 : n;
}

function apply() {
    var preview = document.getElementById('ob_preview');
    if (preview && preview.parentNode) { preview.parentNode.removeChild(preview); }
    var el = document.getElementById('ob_el');
    if (!el) return;
    el.value = toNum(_pn_value);
    el.unit = String(_ps_unit);
    el.tag = String(_ps_tag);
    el.maxDigits = toNum(_pn_digits);
    el.fractionDigits = toNum(_pn_decimals);
    el.size = String(_ps_size);
    el.off = toBool(_pb_off);
    el.hasSetpoint = toBool(_pb_hasSetpoint);
    el.setpoint = toNum(_pn_setpoint);
}

function putValue(id, value) {
    if (id === '_pn_value') { _pn_value = toNum(value); }
    if (id === '_pb_hasSetpoint') { _pb_hasSetpoint = toBool(value); }
    if (id === '_pn_setpoint') { _pn_setpoint = toNum(value); }
    if (id === '_ps_unit') { _ps_unit = String(value); }
    if (id === '_ps_tag') { _ps_tag = String(value); }
    if (id === '_pn_digits') { _pn_digits = toNum(value); }
    if (id === '_pn_decimals') { _pn_decimals = toNum(value); }
    if (id === '_ps_size') { _ps_size = String(value); }
    if (id === '_pb_off') { _pb_off = toBool(value); }
    apply();
}

function postValue(id, value) {
    // replaced at runtime: writes value to the tag bound to "id"
}

function fitBox() {
    var root = document.getElementById('ob_root');
    var fo = document.getElementById('ob_fo');
    var el = document.getElementById('ob_el');
    if (!root || !fo || !el) return;
    var w = parseFloat(root.getAttribute('width')) || 144;
    var h = parseFloat(root.getAttribute('height')) || 72;
    if (root.getAttribute('viewBox') !== '0 0 ' + w + ' ' + h) {
        root.setAttribute('viewBox', '0 0 ' + w + ' ' + h);
    }
    fo.setAttribute('width', w);
    fo.setAttribute('height', h);

}

(function () {
    var root = document.getElementById('ob_root');
    fitBox();
    if (root && window.MutationObserver) {
        new MutationObserver(fitBox).observe(root, { attributes: true, attributeFilter: ['width', 'height'] });
    }
})();

apply();
]]></script>
</svg>

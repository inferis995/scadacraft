<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" id="ob_root" width="192" height="120" viewBox="0 0 192 120" overflow="visible">
  <desc>ScadaCraft OpenBridge widget: Readout (obc-automation-readout, OpenBridge 1.0.0, Apache-2.0).
Box 192x120 px, anchor at (96,48).
Bindable properties:
  _pn_value (default 0): Process value
  _ps_unit (default 'm3/h'): Engineering unit
  _pn_digits (default 3): Integer digits shown
  _ps_position (default 'top'): Where the readout sits relative to its anchor (tick end): top | bottom | left | right</desc>
  <rect id="ob_bg" x="0" y="0" width="192" height="120" fill="none" />
  <image id="ob_preview" x="0" y="0" width="192" height="120" href="data:image/png;base64," xlink:href="data:image/png;base64," />
  <foreignObject id="ob_fo" x="0" y="0" width="192" height="120" overflow="visible">
    <div xmlns="http://www.w3.org/1999/xhtml" style="position:relative;width:100%;height:100%;overflow:visible;">
      <obc-automation-readout id="ob_el" style="position:absolute;left:96px;top:48px;"></obc-automation-readout>
    </div>
  </foreignObject>
  <script type="text/javascript"><![CDATA[
//!export-start
let _pn_value = 0;
let _ps_unit = 'm3/h';
let _pn_digits = 3;
let _ps_position = 'top';
//!export-end

function toBool(v) {
    if (v === true || v === 1) return true;
    var s = String(v).toLowerCase();
    return s === 'true' || s === '1' || s === 'on';
}

function toNum(v) {
    var n = parseFloat(v);
    return isNaN(n) ? 0 : n;
}

function apply() {
    var preview = document.getElementById('ob_preview');
    if (preview && preview.parentNode) { preview.parentNode.removeChild(preview); }
    var el = document.getElementById('ob_el');
    if (!el) return;
    el.value = toNum(_pn_value);
    el.unit = String(_ps_unit);
    el.numberOfDigits = toNum(_pn_digits);
    el.position = String(_ps_position);
}

function putValue(id, value) {
    if (id === '_pn_value') { _pn_value = toNum(value); }
    if (id === '_ps_unit') { _ps_unit = String(value); }
    if (id === '_pn_digits') { _pn_digits = toNum(value); }
    if (id === '_ps_position') { _ps_position = String(value); }
    apply();
}

function postValue(id, value) {
    // replaced at runtime: writes value to the tag bound to "id"
}

apply();
]]></script>
</svg>

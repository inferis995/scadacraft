<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" id="ob_root" width="120" height="120" viewBox="0 0 120 120" overflow="visible">
  <desc>ScadaCraft OpenBridge widget: Transformer (obc-transformer, OpenBridge 1.0.0, Apache-2.0).
Library: OpenBridge · Automation (P&amp;ID). Box 120x120 px, anchor at (48,48).
Bindable properties:
  _pb_on (default false, read): Energised
  _ps_readout (default 'bottom', read): Readout side: top | bottom | left | right
  _pb_alarm (default false, read): Alarm active (alert frame)
  _pb_auto (default false, read): Badge: automatic mode
  _pb_locked (default false, read): Badge: command locked
  _pb_duty (default false, read): Badge: duty unit
  _pb_alarmOff (default false, read): Badge: alarms suppressed
  _ps_tag (default '', read): Numeric equipment ID shown as #NNNN, e.g. 901 (empty = hidden)</desc>
  <metadata data-scadacraft="widget-properties">{"widget": "Transformer", "properties": {"_pb_on": {"label": "Energised", "description": "Energised", "dir": "read"}, "_ps_readout": {"label": "Readout side", "description": "Readout side: top | bottom | left | right", "dir": "read"}, "_pb_alarm": {"label": "Alarm active", "description": "Alarm active (alert frame)", "dir": "read"}, "_pb_auto": {"label": "Badge", "description": "Badge: automatic mode", "dir": "read"}, "_pb_locked": {"label": "Badge", "description": "Badge: command locked", "dir": "read"}, "_pb_duty": {"label": "Badge", "description": "Badge: duty unit", "dir": "read"}, "_pb_alarmOff": {"label": "Badge", "description": "Badge: alarms suppressed", "dir": "read"}, "_ps_tag": {"label": "Numeric equipment ID shown as #NNNN", "description": "Numeric equipment ID shown as #NNNN, e.g. 901 (empty = hidden)", "dir": "read"}}}</metadata>
  <rect id="ob_bg" x="0" y="0" width="120" height="120" fill="none" />
  <image id="ob_preview" x="0" y="0" width="120" height="120" href="data:image/png;base64," xlink:href="data:image/png;base64," />
  <foreignObject id="ob_fo" x="0" y="0" width="120" height="120" overflow="visible">
    <div xmlns="http://www.w3.org/1999/xhtml" style="position:relative;width:100%;height:100%;overflow:visible;">
      <obc-transformer id="ob_el" style="position:absolute;left:48px;top:48px;"></obc-transformer>
    </div>
  </foreignObject>
  <script type="text/javascript"><![CDATA[
//!export-start
let _pb_on = false;
let _ps_readout = 'bottom';
let _pb_alarm = false;
let _pb_auto = false;
let _pb_locked = false;
let _pb_duty = false;
let _pb_alarmOff = false;
let _ps_tag = '';
//!export-end

var __busyUntil = 0;

function toBool(v) {
    if (v === true || v === 1) return true;
    var s = String(v).toLowerCase();
    return s === 'true' || s === '1' || s === 'on';
}

function toNum(v) {
    if (v === true || v === 'true') return 1;
    if (v === false || v === 'false') return 0;
    var n = parseFloat(v);
    return isNaN(n) ? 0 : n;
}

function apply() {
    var preview = document.getElementById('ob_preview');
    if (preview && preview.parentNode) { preview.parentNode.removeChild(preview); }
    var el = document.getElementById('ob_el');
    if (!el) return;
    el.on = toBool(_pb_on);
    el.readoutPosition = String(_ps_readout);
    el.alert = toBool(_pb_alarm);
    el.badgeAuto = toBool(_pb_auto);
    el.badgeCommandLocked = toBool(_pb_locked);
    el.badgeDuty = toBool(_pb_duty);
    el.badgeAlertOff = toBool(_pb_alarmOff);
    el.tag = String(_ps_tag);
    el.hasIdTag = String(_ps_tag).length > 0;
}

function putValue(id, value) {
    if (id === '_pb_on') { _pb_on = toBool(value); }
    if (id === '_ps_readout') { _ps_readout = String(value); }
    if (id === '_pb_alarm') { _pb_alarm = toBool(value); }
    if (id === '_pb_auto') { _pb_auto = toBool(value); }
    if (id === '_pb_locked') { _pb_locked = toBool(value); }
    if (id === '_pb_duty') { _pb_duty = toBool(value); }
    if (id === '_pb_alarmOff') { _pb_alarmOff = toBool(value); }
    if (id === '_ps_tag') { _ps_tag = String(value); }
    apply();
}

function postValue(id, value) {
    // replaced at runtime: writes value to the tag bound to "id"
}

apply();
]]></script>
</svg>
